services:
  web:
    container_name: filezconverter_dev
    build:
      context: ./code/frontend
      dockerfile: Dockerfile.dev
      args:
        PORT: ${PORT:?set in .env.development}
    ports:
      - "${FRONTEND_PORT:?set in .env.development}:${PORT}"
    volumes:
      - ./code/frontend/app:/app/app:rw
      - ./code/frontend/components:/app/components:rw
      - ./code/frontend/lib:/app/lib:rw
      - ./code/frontend/hooks:/app/hooks:rw
      - ./code/frontend/types:/app/types:rw
      - ./code/frontend/public:/app/public:ro
      - ./code/frontend/next.config.ts:/app/next.config.ts:ro
      - /app/node_modules
      - /app/.next
    env_file: .env.development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
