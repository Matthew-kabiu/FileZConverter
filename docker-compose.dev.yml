services:
  web:
    container_name: filezconverter_dev
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: ./code/frontend
      dockerfile: Dockerfile.dev
      args:
        PORT: ${PORT:?set in .env.development}
    ports:
      - "${FRONTEND_PORT:?set in .env.development}:${PORT}"
    volumes:
      # Mount the source directory, not individual files. Single-file bind
      # mounts remain pinned to an old inode when editors save via atomic rename.
      - ./code/frontend:/app:rw
      - /app/node_modules
      - /app/.next
      - app-data:/app/data
      - hf-cache:/root/.cache/huggingface
    env_file: .env.development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    container_name: filezconverter_redis_dev
    image: redis/redis-stack:7.4.0-v1
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?set in env} --appendonly no"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set in env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app-data: {}
  hf-cache: {}
