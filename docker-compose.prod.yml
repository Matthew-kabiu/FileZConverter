services:
  web:
    container_name: filezconverter_prod
    build:
      context: ./code/frontend
      dockerfile: Dockerfile.prod
      args:
        PORT: ${PORT:?set in env}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    expose:
      - "${PORT}"
    env_file: .env
    deploy:
      resources:
        limits: { cpus: '1', memory: 2G }
        reservations: { cpus: '0.25', memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  nginx:
    container_name: filezconverter_nginx
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:?set in env}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
