services:
  web:
    container_name: filezconverter_prod
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: ./code/frontend
      dockerfile: Dockerfile.prod
      args:
        PORT: ${PORT:?set in env}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    ports:
      - "${PORT}:${PORT}"
    env_file: .env
    volumes:
      - app-data:/app/data
    deploy:
      resources:
        limits: { cpus: '1', memory: 2G }
        reservations: { cpus: '0.25', memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    container_name: filezconverter_redis_prod
    image: redis/redis-stack:7.4.0-v1
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?set in env} --appendonly no"
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set in env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app-data: {}
