# FilezConverter CI — lint + typecheck + tests + production build.
# Nothing else lives here: no deploy, no audit, no releases.
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    env:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
      NEXT_PUBLIC_APP_NAME: FilezConverter
      # Auth code requires these at import/build time; test-only values.
      BETTER_AUTH_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      # System converters the test suite shells out to (mirrors Dockerfiles).
      - name: Install system converters
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libreoffice-writer libreoffice-calc libreoffice-impress
          poppler-utils

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
