# Prod reverse proxy (nginx:alpine). Plain static file on purpose.
#
# NOTE: the app upstream is fixed to web:3000 — the internal container PORT
# must stay 3000 (see .env). If PORT ever changes, update `server` below.
#
# Header policy is deliberately app-safe:
# - NO Content-Security-Policy here: the app sends its own (it must allow
#   blob: previews and Next.js inline runtime; a second CSP would only ever
#   tighten and break previews).
# - client_max_body_size covers the 25MB upload cap with headroom.
# - Proxy timeouts cover the 60s conversion ceiling with headroom.
# - HSTS is inert without TLS and correct once TLS terminates here.
upstream app {
  server web:3000;
}

server {
  listen 80;
  server_name filezconverter.triffixsolutions.co.ke;

  client_max_body_size 32m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/health {
    proxy_pass http://app/api/health;
    access_log off;
  }
}
